<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Expense &amp; Budget Visualizer</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <main>
      <!-- ===========================
           Expense Form
           =========================== -->
      <section id="form-section">
        <h1>Expense &amp; Budget Visualizer</h1>
        <form id="expense-form" novalidate>
          <div class="form-group">
            <label for="item-name">Item Name</label>
            <input
              type="text"
              id="item-name"
              name="item-name"
              maxlength="100"
              placeholder="e.g. Coffee"
              autocomplete="off"
            />
            <span class="error" id="name-error" aria-live="polite"></span>
          </div>

          <div class="form-group">
            <label for="amount">Amount ($)</label>
            <input
              type="number"
              id="amount"
              name="amount"
              step="0.01"
              min="0"
              placeholder="e.g. 4.50"
            />
            <span class="error" id="amount-error" aria-live="polite"></span>
          </div>

          <div class="form-group">
            <label for="category">Category</label>
            <select id="category" name="category">
              <option value="">-- Select category --</option>
              <option value="Food">Food</option>
              <option value="Transport">Transport</option>
              <option value="Fun">Fun</option>
            </select>
            <span class="error" id="category-error" aria-live="polite"></span>
          </div>

          <button type="submit">Add Expense</button>
        </form>
      </section>

      <!-- ===========================
           Transaction List + Total Display
           =========================== -->
      <section id="list-section">
        <div id="summary">
          <h2>Transactions</h2>
          <p>Total: <span id="total-display">$0.00</span></p>
        </div>
        <ul id="transaction-list" aria-label="Transaction list">
          <li id="empty-message">No expenses added yet.</li>
        </ul>
      </section>

      <!-- ===========================
           Chart Section
           =========================== -->
      <section id="chart-section">
        <h2>Spending by Category</h2>
        <canvas id="expense-chart" aria-label="Pie chart of spending by category" role="img"></canvas>
        <p id="chart-placeholder">No spending data available.</p>
      </section>
    </main>

    <!-- Non-blocking storage error notification -->
    <div id="storage-error" role="alert" aria-live="polite"></div>

    <!-- Chart.js must be loaded before js/script.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="js/script.js" defer></script>
  </body>
</html>
